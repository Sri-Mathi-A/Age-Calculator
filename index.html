<!DOCTYPE html>
<html>

<head>

<title>Age Calculator</title>

<style>

body {
    font-family: Arial;
    background: #eee;
    text-align: center;
}

.container {
    width: 500px;
    margin: 60px auto;
    background: white;
    padding: 30px;
    border-radius: 12px;
}

button {
    padding: 12px 25px;
    margin: 10px;
}

.option {
    display: block;
    width: 80%;
    margin: 10px auto;
}

</style>

</head>

<body>

<div class="container">

<h1>Age Calculator</h1>
<input type="number" id="birthYear" placeholder="Enter your birth year" />
<input type="number" id="currentYear" placeholder="Enter the current year" />

<button onclick="AgeCalc()">Calculate Age</button>

<h2 id="age"></h2>

</div>

<script>


let current = 0;
let score = 0;

function AgeCalc() {
    let birthYear = parseInt(document.getElementById("birthYear").value);
    let currentYear = parseInt(document.getElementById("currentYear").value);
    let age = currentYear - birthYear;
    document.getElementById("age").innerText = "Your Age: " + age;
    birthYear = "";
    currentYear = "";
}
</script>

</body>

</html>
